name: Update now playing

on:
  schedule:
    # Every 30 minutes. GitHub runs scheduled jobs late under load, so treat
    # this as "roughly half-hourly" rather than a guarantee.
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nowplaying
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch from Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
        run: node scripts/nowplaying.mjs

      - name: Commit if the block changed
        run: |
          git config user.name  "nowplaying-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          # The script exits without writing when nothing changed, so this is
          # usually a no-op. Guard anyway.
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update now playing"
            git push
          fi
